pull_request_rules:
  - name: automatic merge for Dependabot pull requests
    conditions:
      - author~=^dependabot(|-preview)\[bot\]$
    actions:
      merge:
        method: merge
  - name: automatic merge for Renovate pull requests
    conditions:
      - author=renovate[bot]
      - -draft
      - check-success=Built assets are current
      - check-success=PHP 7.2
      - check-success=PHP 7.4
      - check-success=PHP 8.0
      - check-success=PHP 8.2
      - check-success=PHP 8.3
      - check-success=PHP 8.4
    actions:
      merge:
        method: merge
  - name: automatic merge for ImgBot pull requests
    conditions:
      - author=imgbot[bot]
    actions:
      merge:
        method: merge
merge_protections_settings:
  reporting_method: check-runs
